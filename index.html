<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Aleksandra i Marko</title>

<meta property="og:title" content="Aleksandra i Marko">
<meta property="og:description" content="Naše venčanje · 22. novembar 2026.">

<meta property="og:image" content="https://aandreaq.github.io/wedding-invatation/img/anaimarko.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">

<meta property="og:type" content="website">
<meta property="og:url" content="https://aandreaq.github.io/wedding-invatation/">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Aleksandra i Marko">
<meta name="twitter:description" content="Naše venčanje · 22. novembar 2026.">
<meta name="twitter:image" content="https://aandreaq.github.io/wedding-invatation/img/anaimarko.jpg">


</head>

<body>

    <!-- ZLATNI GLITTER -->
    <div id="goldGlitter"></div>

    <!-- DEKORATIVNI ZLATNI OKVIR -->
    <div class="gold-frame"></div>

    <!-- ORNAMENTI U ĆOŠKOVIMA -->
    <div class="corner-ornament top-left">❦</div>
    <div class="corner-ornament top-right">❦</div>
    <div class="corner-ornament bottom-left">❦</div>
    <div class="corner-ornament bottom-right">❦</div>


    <!-- PADAJUĆE BELE LATICE -->
    <div class="petals" id="petals"></div>


    <!-- GLAVNA STRANA -->
    <main class="cover">

        <div class="invitation-image">

            <!-- ZLATNI GLOW -->
            <div class="invitation-glow"></div>

            <img
                src="img/dove.png"
                alt="Pozivnica za venčanje"
            >

            <!-- DUGME -->
            <button id="openInvitation">
                <span class="button-sparkle">✦</span>
                OTVORITE
                <span class="button-sparkle">✦</span>
            </button>

        </div>

    </main>


    <!-- VATROMET -->
    <div id="fireworks"></div>
    
    <audio id="weddingMusic" preload="auto">
    <source src="audio/24-7.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
